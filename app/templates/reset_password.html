{% extends "base.html" %}

{% block content %}
<div class="container" style="margin-top: 60px;">
    <div class="row">
        <div class="col-md-6 col-md-offset-3">
            <h3 class="text-center" style="margin-bottom: 30px; color: #2c3e50; font-weight: bold;">
                <i class="fas fa-lock"></i> Restablecer Contraseña
            </h3>
            
            <div class="panel panel-default" style="border-radius: 10px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
                <div class="panel-body" style="padding: 30px;">
                    <form method="POST" action="{{ url_for('auth.reset_password', email=email, token=token) }}">
                        
                        <div class="form-group" style="margin-bottom: 25px;">
                            <label for="password" style="color: #34495e;">Escribe tu nueva contraseña</label>
                            <input type="password" class="form-control input-lg" id="password" name="password" required minlength="6" placeholder="Mínimo 6 caracteres" style="border-radius: 6px;">
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-lg btn-block" style="background-color: #3498db; border: none; border-radius: 6px; transition: 0.3s;">
                            Guardar nueva contraseña
                        </button>
                        
                    </form>
                </div>
            </div>
            
            <div class="text-center" style="margin-top: 20px;">
                <a href="{{ url_for('auth.login') }}" style="color: #7f8c8d; text-decoration: none;">
                    <i class="fas fa-arrow-left"></i> Volver al Login
                </a>
            </div>
            
        </div>
    </div>
</div>
{% endblock %}
