{% extends "base.html" %}
{% import "bootstrap/wtf.html" as wtf %}

{% block title %}Registrar Administrador{% endblock %}

{% block page_content %}
<div class="row" style="margin-top: 50px;">
    <div class="col-md-4 col-md-offset-4">
        <div class="panel panel-success">
            <div class="panel-heading">
                <h3 class="panel-title"><i class="fas fa-user-plus"></i> Alta de Nuevo Administrador</h3>
            </div>
            <div class="panel-body">
                {{ wtf.quick_form(form, button_map={'submit': 'success btn-block'}) }}
            </div>
            <div class="panel-footer text-center">
                <a href="{{ url_for('auth.login') }}">Volver al Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
